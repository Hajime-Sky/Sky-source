name: Patch candle local date label once
on:
  push:
    paths:
      - '.github/workflows/_patch-candle-local-date-label-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sky_今日の大キャン案内.js')
          s = p.read_text(encoding='utf-8')
          marker = 'function renderWidgetImageWithDate(image, family, dateText) {'
          helper = r'''function getTreasureWidgetLocalDateParts(reference = new Date()) {
  const d = reference instanceof Date ? reference : new Date(reference);
  const common = readSkyCommonSettingsSafe();
  if (common && common.timezone && common.timezone.mode === "manual") {
    const offsetHours = Number(common.timezone.utcOffsetHours);
    if (Number.isFinite(offsetHours)) {
      const shifted = new Date(d.getTime() + offsetHours * 60 * 60 * 1000);
      return { year: shifted.getUTCFullYear(), month: shifted.getUTCMonth() + 1, day: shifted.getUTCDate() };
    }
  }
  return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
}
function formatTreasureWidgetDateText(reference, skyYMD) {
  const local = getTreasureWidgetLocalDateParts(reference);
  const localKey = `${String(local.year).padStart(4, "0")}-${String(local.month).padStart(2, "0")}-${String(local.day).padStart(2, "0")}`;
  const skyKey = /^\d{4}-\d{2}-\d{2}$/.test(String(skyYMD || "")) ? String(skyYMD) : localKey;
  const phase = localKey > skyKey ? "更新前" : "更新後";
  return `${local.month}月${local.day}日　${phase}`;
}
'''
          if 'function formatTreasureWidgetDateText(' not in s:
              if marker not in s:
                  raise SystemExit('render marker not found')
              s = s.replace(marker, helper + marker, 1)
          old = 'async function createWidget(options = {}) {\n  const res = calcForCurrentLATime();'
          new = 'async function createWidget(options = {}) {\n  const referenceNow = getSkyCommonNow();\n  const res = calcForCurrentLATime(referenceNow);'
          if new not in s:
              if old not in s: raise SystemExit('createWidget marker not found')
              s = s.replace(old, new, 1)
          old = 'let bgImage = renderWidgetImageWithDate(image, family, res.skyYMD);'
          new = 'let bgImage = renderWidgetImageWithDate(image, family, formatTreasureWidgetDateText(referenceNow, res.skyYMD));'
          if new not in s:
              if old not in s: raise SystemExit('widget render call not found')
              s = s.replace(old, new, 1)
          old = 'async function previewTodayImage() {\n  const res = calcForCurrentLATime();'
          new = 'async function previewTodayImage() {\n  const referenceNow = getSkyCommonNow();\n  const res = calcForCurrentLATime(referenceNow);'
          if new not in s:
              if old not in s: raise SystemExit('preview marker not found')
              s = s.replace(old, new, 1)
          old = 'const composed = renderWidgetImageWithDate(image, "large", res.skyYMD);'
          new = 'const composed = renderWidgetImageWithDate(image, "large", formatTreasureWidgetDateText(referenceNow, res.skyYMD));'
          if new not in s:
              if old not in s: raise SystemExit('preview render call not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check 'Sky_今日の大キャン案内.js'
          grep -q 'formatTreasureWidgetDateText(referenceNow, res.skyYMD)' 'Sky_今日の大キャン案内.js'
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Hajime-Sky'
          git config user.email 'hajikun1511+github-1@gmail.com'
          git add 'Sky_今日の大キャン案内.js'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore local update-window date label'
          git push
# trigger
