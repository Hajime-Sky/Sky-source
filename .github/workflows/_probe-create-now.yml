name: Probe create workflow now
on:
  create:
permissions:
  contents: write
jobs:
  probe:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'trigger-probe-now-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          echo "${GITHUB_REF_NAME}" > .workflow-probe-now
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow-probe-now
          git commit -m 'Confirm current create workflow trigger'
          git push origin main