name: Test create trigger
on:
  create:
permissions:
  contents: write
jobs:
  test:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'trigger-public-actions-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" > .action-create-ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .action-create-ok
          git commit -m 'Confirm create-event workflow trigger'
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}" || true