name: Apply Sky common settings to big candle source
on:
  push:
    paths:
      - .github/workflows/apply-big-candle-common-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch big candle source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sky_今日の大キャン案内.js')
          t=p.read_text()
          def rep(old,new,label):
              global t
              if new in t: return
              if old not in t: raise SystemExit(label+' marker not found')
              t=t.replace(old,new,1)
          anchor='const UPDATE_POLICIES = Object.freeze(["none", "daily", "always"]);\n'
          insert='''let SKY_COMMON_SETTINGS = null;\ntry { SKY_COMMON_SETTINGS = importModule("HajimeSkyTools/common-settings"); } catch (_) {}\nfunction readSkyCommonSettingsSafe() {\n  try { return SKY_COMMON_SETTINGS && typeof SKY_COMMON_SETTINGS.load === "function" ? SKY_COMMON_SETTINGS.load() : null; } catch (_) { return null; }\n}\nfunction openSkyCommonSettings() {\n  try {\n    if (SKY_COMMON_SETTINGS && typeof SKY_COMMON_SETTINGS.open === "function") SKY_COMMON_SETTINGS.open();\n    else Safari.open("scriptable:///run?scriptName=" + encodeURIComponent("Sky_共通設定"));\n    return true;\n  } catch (_) { return false; }\n}\n'''
          if insert not in t:
              if anchor not in t: raise SystemExit('common import marker not found')
              t=t.replace(anchor,anchor+insert,1)
          rep('  const cycleRealmKey = TREASURE_CANDLE_CYCLE.realmById[mod(dayDiff, TREASURE_CANDLE_CYCLE.realmById.length)];\n  const realmIndex = Math.max(0, REALMS.findIndex(r => r.key === cycleRealmKey));','  const automaticRealmKey = TREASURE_CANDLE_CYCLE.realmById[mod(dayDiff, TREASURE_CANDLE_CYCLE.realmById.length)];\n  const common = readSkyCommonSettingsSafe();\n  const overrideRealmKey = String(common?.realmOverrides?.treasure || "");\n  const cycleRealmKey = REALMS.some(r => r.key === overrideRealmKey) ? overrideRealmKey : automaticRealmKey;\n  const realmIndex = Math.max(0, REALMS.findIndex(r => r.key === cycleRealmKey));','realm override')
          rep('function readUpdateState() {\n  const state = readJsonFile(UPDATE_STATE_KEY + ".json", {});\n  const policy = UPDATE_POLICIES.includes(String(state?.policy || "")) ? String(state.policy) : "daily";','function readUpdateState() {\n  const state = readJsonFile(UPDATE_STATE_KEY + ".json", {});\n  const commonPolicy = String(readSkyCommonSettingsSafe()?.github?.updatePolicy || "");\n  const localPolicy = UPDATE_POLICIES.includes(String(state?.policy || "")) ? String(state.policy) : "daily";\n  const policy = UPDATE_POLICIES.includes(commonPolicy) ? commonPolicy : localPolicy;','policy read')
          rep('function setUpdatePolicy(policy) {\n  const normalized = UPDATE_POLICIES.includes(String(policy || "")) ? String(policy) : "daily";\n  writeUpdateStatePatch({ policy: normalized });\n  return normalized;\n}','function setUpdatePolicy(policy) {\n  const normalized = UPDATE_POLICIES.includes(String(policy || "")) ? String(policy) : "daily";\n  try {\n    if (SKY_COMMON_SETTINGS && typeof SKY_COMMON_SETTINGS.load === "function" && typeof SKY_COMMON_SETTINGS.save === "function") {\n      const common = SKY_COMMON_SETTINGS.load();\n      common.github = { ...(common.github || {}), updatePolicy: normalized };\n      SKY_COMMON_SETTINGS.save(common);\n    }\n  } catch (_) {}\n  writeJsonFile(UPDATE_STATE_KEY + ".json", { ...readJsonFile(UPDATE_STATE_KEY + ".json", {}), policy: normalized });\n  return normalized;\n}','policy save')
          rep('    alert.addAction("GitHub更新設定");','    alert.addAction("Sky共通設定");','menu label')
          rep('    if (index === 3) {\n      await showUpdatePolicySettings();\n      continue;\n    }','    if (index === 3) {\n      if (openSkyCommonSettings()) return;\n      await showUpdatePolicySettings();\n      continue;\n    }','menu action')
          p.write_text(t)
          PY
      - name: Syntax check
        run: node --check 'Sky_今日の大キャン案内.js'
      - name: Commit source update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Sky_今日の大キャン案内.js'
          git commit -m 'Integrate Sky common settings into big candle source'
          git push
