name: Apply common Sky appearance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove reminder-local theme control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, datetime

          root = Path('.')
          mod = root / 'SkyReminderModules'
          p = mod / '005_app_ui_html_and_client.js'
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''\n\s*Object\.freeze\(\{\n\s*key: "theme", label: "テーマ", segmentedId: "seg-theme", segmentedClass: "segmented narrow",\n\s*options: \[\{ value: "light", label: "ライト" \}, \{ value: "dark", label: "ダーク" \}\],\n\s*\}\),''')
          s2, count = pattern.subn('', s, count=1)
          if count != 1:
              raise SystemExit('star reminder theme setting block not found exactly once')
          p.write_text(s2, encoding='utf-8')

          mpath = mod / 'manifest.json'
          m = json.loads(mpath.read_text(encoding='utf-8'))
          for ent in m.get('parts', []):
              if not isinstance(ent, dict) or not ent.get('file'):
                  continue
              fp = mod / ent['file']
              ent['sha256'] = hashlib.sha256(fp.read_bytes()).hexdigest()
          main = root / str(m.get('mainScript') or 'Sky_星の子リマインダー.js')
          if main.exists():
              m.setdefault('mainScriptFile', {})['sha256'] = hashlib.sha256(main.read_bytes()).hexdigest()
          m['sourceVersion'] = 'v2.20_common_appearance'
          m['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          mpath.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          d=Path('SkyReminderModules')
          m=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          ui=(d/'005_app_ui_html_and_client.js').read_text(encoding='utf-8')
          if 'key: "theme", label: "テーマ"' in ui:
              raise SystemExit('theme control still present')
          for ent in m['parts']:
              p=d/ent['file']
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != ent['sha256']:
                  raise SystemExit(f'hash mismatch: {ent["file"]}')
          Path('/tmp/reminder-bundle.js').write_text('(async()=>{\n'+'\n'.join((d/x['file']).read_text(encoding='utf-8') for x in m['parts'])+'\n})();',encoding='utf-8')
          PY
          node --check /tmp/reminder-bundle.js
          cp Sky_星の子リマインダー.js /tmp/reminder-loader.mjs
          node --check /tmp/reminder-loader.mjs
      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SkyReminderModules/005_app_ui_html_and_client.js SkyReminderModules/manifest.json
          git commit -m "Move reminder appearance to common settings"
          git push origin main
