name: Apply Sky common system v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply common system patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, unicodedata, datetime

          root = Path('.')
          mod = root / 'SkyReminderModules'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p, s): p.write_text(s, encoding='utf-8')
          def nfc(s): return unicodedata.normalize('NFC', s)
          def find_root(name):
              for p in root.glob('*.js'):
                  if nfc(p.name) == nfc(name): return p
              raise RuntimeError('root script not found: ' + name)

          # Reminder navigation help: system page now delegates all non-destructive system work.
          p = mod / '001_constants_and_navigation.js'
          s = read(p)
          a = s.find('  Object.freeze({\n    id: "data",')
          b = s.find('  Object.freeze({\n    id: "intro",', a)
          if a >= 0 and b > a:
              block = '''  Object.freeze({
              id: "data",
              label: "システム",
              helpText: `<h4 style='color:var(--color-primary); margin-top:0;'>⚙️ システムとデータ</h4><p style='line-height:1.6;'>Sky系で共通化できる設定と保守操作は<b>Sky共通設定</b>にまとめています。この画面には通知プリセットと、このアプリ固有データの削除・初期化だけを残しています。</p><ul style='padding-left:20px; line-height:1.6; margin-bottom:12px;'><li><b>Sky共通設定：</b>時刻、タイムトラベル、地方上書き、キャッシュ、画像取得、更新、バックアップを管理します。</li><li><b>通知プリセット：</b>星の子リマインダー固有の通知構成だけを一括変更します。</li><li><b>削除・初期化：</b>このアプリの保存データを消す操作なので、この画面に残しています。</li></ul>${buildYouTubeEmbedHtml(HELP_VIDEO_IDS.data, "システムの操作動画")}`,
            }),
          '''
              s = s[:a] + block + s[b:]
              write(p, s)

          # Reminder app UI: leave only common-settings entry, presets, and delete/reset operations.
          p = mod / '005_app_ui_html_and_client.js'
          s = read(p)
          s = s.replace('時差、地方の上書き、GitHub更新頻度、バックアップ保存先はSky系アプリで共通管理します。',
                        'システム設定と保守操作はSky共通設定で管理します。通知プリセットとデータ削除だけこの画面に残します。')
          s = s.replace('本番 / テストの状態、保存データ、危険操作を混ぜずに確認できるよう整理しています。',
                        '共通設定、通知プリセット、削除・初期化を役割ごとに分けています。')
          # Remove time-travel card.
          st = s.find('      <div class="section zone-virtual system-card">')
          en = s.find('      <div class="section system-card">\n        <h3>通知プリセット</h3>', st)
          if st >= 0 and en > st: s = s[:st] + s[en:]
          # Replace image card with delete-only variant.
          h = s.find('<h3>画像の管理</h3>')
          if h >= 0:
              st = s.rfind('      <div class="section system-card">', 0, h)
              gh = s.find('<h3>GitHubアップデート</h3>', h)
              en = s.rfind('      <div class="section system-card">', h, gh) if gh >= 0 else -1
              if st >= 0 and en > st:
                  block = '''      <div class="section system-card">
                <h3>画像の管理</h3>
                <div class="rule-subnote">画像の再取得はSky共通設定へ移動しました。ここでは画像の保存データ削除だけ行えます。</div>
                <div class="system-stack-actions">
                  <div class="btn danger del-btn" onclick="confirmDelete('IMAGES', '画像キャッシュ', this)">画像の保存データを整理</div>
                </div>
              </div>
          '''
                  s = s[:st] + block + s[en:]
          # Remove GitHub and import/export cards.
          gh = s.find('<h3>GitHubアップデート</h3>')
          dh = s.find('<h3>データの管理</h3>', gh)
          if gh >= 0 and dh > gh:
              st = s.rfind('      <div class="section system-card">', 0, gh)
              en = s.rfind('      <div class="section system-card">', gh, dh)
              if st >= 0 and en > st: s = s[:st] + s[en:]
          # Replace data card with delete-only variant; HTML export and cache toggle moved out.
          dh = s.find('<h3>データの管理</h3>')
          if dh >= 0:
              st = s.rfind('      <div class="section system-card">', 0, dh)
              en = s.find('      <div class="section zone-destructive system-card">', dh)
              if st >= 0 and en > st:
                  block = '''      <div class="section system-card">
                <h3>データの管理</h3>
                <div class="rule-subnote">特定の保存データだけ消したいときは、下のボタンから個別に整理できます。</div>
                <div class="system-action-grid" style="margin-top:12px;">
                  <div class="btn danger del-btn" onclick="confirmDelete('${KEYCHAIN_KEY}', '設定データ', this)">設定データ</div>
                  <div class="btn danger del-btn" onclick="confirmDelete('RUNSTATE', '完了状態', this)">完了状態</div>
                  <div class="btn danger del-btn" onclick="confirmDelete('${getDisabledNotiKey(settings)}', 'オフリスト', this)">オフリスト</div>
                  <div class="btn danger del-btn" onclick="confirmDelete('${CACHE_KEY}', 'キャッシュ', this)">キャッシュ</div>
                </div>
              </div>
          '''
                  s = s[:st] + block + s[en:]
          # Common page can request an HTML dump without opening the reminder UI.
          marker = '  await wv.loadHTML(html, "https://localhost/");\n'
          if 'qp.commonAction || "") === "exportHtml"' not in s and marker in s:
              inject = marker + '''  if (String(qp.commonAction || "") === "exportHtml") {
              try {
                const st = loadSettings();
                const fm = getSettingsBackupFileManager(st);
                const dir = getSettingsBackupDir(st, fm);
                const path = fm.joinPath(dir, buildHtmlDumpFilename(new Date()));
                fm.writeString(path, String(html || ""));
                const alert = new Alert();
                alert.title = "HTMLを書き出しました";
                alert.message = String(path).split("/").pop() + " (" + getSettingsBackupDirLabel(st) + ")";
                alert.addAction("OK");
                await alert.presentAlert();
              } catch (e) {
                const alert = new Alert();
                alert.title = "HTML書き出しに失敗しました";
                alert.message = String(e && e.message || e);
                alert.addAction("OK");
                await alert.presentAlert();
              }
              return;
            }
          '''
              s = s.replace(marker, inject, 1)
          write(p, s)

          # Reminder URL actions callable from common settings.
          p = mod / '007_shortcut_entrypoint.js'
          s = read(p)
          marker = '    const act = String(obj.action || "").toLowerCase();\n    const h = SHORTCUT_HANDLERS[act];'
          if 'act === "commonreloadimages"' not in s and marker in s:
              block = '''    const act = String(obj.action || "").toLowerCase();
              if (act === "commonreloadimages") {
                let failed = [];
                try {
                  const fm = getStorageFileManager();
                  try { safeRemoveKeychainKey(CACHE_KEY, false); } catch (_) {}
                  try { Store.clear(CACHE_KEY); } catch (_) {}
                  const dir = getImagesDir(fm);
                  if (fm.fileExists(dir)) { try { fm.remove(dir); } catch (_) {} }
                  const results = await syncAllConstellationImages(CONSTELLATION_REALMS, fm);
                  failed = (results || []).filter(x => !x || x.ok !== true);
                  const alert = new Alert();
                  alert.title = failed.length ? "画像の再取得に一部失敗" : "画像を再取得しました";
                  alert.message = failed.length ? failed.map(x => String(x?.realm || "?")).join(", ") : "星座画像を更新しました。";
                  alert.addAction("OK");
                  await alert.presentAlert();
                  emit({ ok: failed.length === 0, mode: act, failed: failed.map(x => String(x?.realm || "?")) });
                } catch (e) {
                  const alert = new Alert();
                  alert.title = "画像の再取得に失敗しました";
                  alert.message = String(e && e.message || e);
                  alert.addAction("OK");
                  await alert.presentAlert();
                  emit({ ok:false, mode:act, error:String(e && e.message || e) });
                }
                return;
              }
              if (act === "commongithubupdate") {
                try {
                  const before = skyReminderReadSettings();
                  const beforeAt = Number(before?.githubUpdate?.lastUpdatedAtMs || 0) || 0;
                  await skyReminderManualGithubUpdateAndRestart();
                  const after = skyReminderReadSettings();
                  const afterAt = Number(after?.githubUpdate?.lastUpdatedAtMs || 0) || 0;
                  const status = String(after?.githubUpdate?.lastUpdateStatus || "");
                  const updated = afterAt > beforeAt;
                  const alert = new Alert();
                  alert.title = updated ? "更新しました" : (status.startsWith("error:") ? "更新に失敗しました" : "更新はありません");
                  alert.message = status || (updated ? "更新済み" : "no-update");
                  alert.addAction("OK");
                  await alert.presentAlert();
                  emit({ ok:!status.startsWith("error:"), mode:act, updated, status });
                  if (updated && typeof skyReminderRestartScript === "function") skyReminderRestartScript();
                } catch (e) {
                  const alert = new Alert();
                  alert.title = "GitHub更新に失敗しました";
                  alert.message = String(e && e.message || e);
                  alert.addAction("OK");
                  await alert.presentAlert();
                  emit({ ok:false, mode:act, error:String(e && e.message || e) });
                }
                return;
              }
              const h = SHORTCUT_HANDLERS[act];'''
              s = s.replace(marker, block, 1)
          # Failed auto image fetch disables the visible common preference, not a hidden local copy.
          old = '''    try {
                const st = loadSettings();
                st.imageAutoFetchEnabled = false;
                saveSettings(st);
              } catch (_) {}'''
          if old in s and 'common.images.autoFetchEnabled = false' not in s:
              new = '''    try {
                try {
                  const commonModule = importModule("HajimeSkyTools/common-settings");
                  const common = commonModule.load();
                  common.images = { ...(common.images || {}), autoFetchEnabled: false };
                  commonModule.save(common);
                } catch (_) {}
                const st = loadSettings();
                st.imageAutoFetchEnabled = false;
                saveSettings(st);
              } catch (_) {}'''
              s = s.replace(old, new, 1)
          write(p, s)

          # Loader reads common GitHub settings before module execution.
          reminder = find_root('Sky_星の子リマインダー.js')
          s = read(reminder)
          a = s.find('function skyReminderGetUpdateConfig(manifest) {')
          b = s.find('\nasync function skyReminderLoadManifest', a)
          if a >= 0 and b > a:
              fn = '''function skyReminderGetUpdateConfig(manifest) {
              const st = skyReminderReadSettings();
              const cfg = st.githubUpdate && typeof st.githubUpdate === "object" ? st.githubUpdate : {};
              const mfUpdate = manifest && manifest.update && typeof manifest.update === "object" ? manifest.update : {};
              let commonGithub = null;
              try {
                const commonModule = importModule("HajimeSkyTools/common-settings");
                const common = commonModule && typeof commonModule.load === "function" ? commonModule.load() : null;
                if (common && common.github && typeof common.github === "object") commonGithub = common.github;
              } catch (_) {}
              const remoteManifestUrl = String(commonGithub?.starReminderManifestUrl || cfg.remoteManifestUrl || mfUpdate.remoteManifestUrl || SKY_REMINDER_DEFAULT_REMOTE_MANIFEST_URL).trim();
              const commonPolicy = String(commonGithub?.updatePolicy || "");
              const localPolicy = String(cfg.policy || "");
              const policy = ["none", "daily", "always"].includes(commonPolicy)
                ? commonPolicy
                : (["none", "daily", "always"].includes(localPolicy) ? localPolicy : "daily");
              const lastCheckedAtMs = Number(cfg.lastCheckedAtMs || 0) || 0;
              return { remoteManifestUrl, policy, lastCheckedAtMs };
            }
          '''
              s = s[:a] + fn + s[b:]
          write(reminder, s)

          # Big candle: shared test clock + common image auto-fetch + maintenance entry points.
          candle = find_root('Sky_今日の大キャン案内.js')
          s = read(candle)
          marker = '''function readSkyCommonSettingsSafe() {
            try { return SKY_COMMON_SETTINGS && typeof SKY_COMMON_SETTINGS.load === "function" ? SKY_COMMON_SETTINGS.load() : null; } catch (_) { return null; }
          }
          '''
          if 'function getSkyCommonNow(' not in s and marker in s:
              add = marker + '''function getSkyCommonNow(reference = new Date()) {
              try {
                if (SKY_COMMON_SETTINGS && typeof SKY_COMMON_SETTINGS.effectiveDate === "function") return SKY_COMMON_SETTINGS.effectiveDate(reference);
              } catch (_) {}
              return reference instanceof Date ? reference : new Date(reference);
            }
            function commonImageAutoFetchEnabled() {
              const common = readSkyCommonSettingsSafe();
              return !(common && common.images && common.images.autoFetchEnabled === false);
            }
          '''
              s = s.replace(marker, add, 1)
          s = s.replace('function calcForCurrentLATime(dateObj = new Date()) {', 'function calcForCurrentLATime(dateObj = getSkyCommonNow()) {')
          s = s.replace('  const now = new Date();\n  const res = calcForCurrentLATime(now);', '  const now = getSkyCommonNow();\n  const res = calcForCurrentLATime(now);')
          s = s.replace('  if (!isCacheUsable(initialMeta) || needsQualityRefresh(initialMeta)) {', '  if (commonImageAutoFetchEnabled() && (!isCacheUsable(initialMeta) || needsQualityRefresh(initialMeta))) {')
          s = s.replace('  const now = new Date();\n  await notifyIfCalledOutsideLaMidnight(now);', '  const now = getSkyCommonNow();\n  await notifyIfCalledOutsideLaMidnight(now);')
          bottom = 'if (config.runsInWidget) {'
          if 'const __commonAction = String(args?.queryParameters?.commonAction || "");' not in s and bottom in s:
              s = s.replace(bottom, '''const __commonAction = String(args?.queryParameters?.commonAction || "");
            if (__commonAction === "githubUpdate") {
              await runManualUpdateAndMaybeRestart();
              Script.complete();
            } else if (__commonAction === "reloadImages") {
              await runSyncAndReport();
              Script.complete();
            } else if (config.runsInWidget) {''', 1)
          write(candle, s)

          # Refresh star-reminder manifest hashes.
          mp = mod / 'manifest.json'
          manifest = json.loads(read(mp))
          manifest['sourceVersion'] = 'v2.20_common_system_settings'
          manifest['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          for entry in manifest.get('parts', []):
              f = entry.get('file') if isinstance(entry, dict) else None
              if f and (mod/f).exists(): entry['sha256'] = hashlib.sha256((mod/f).read_bytes()).hexdigest()
          for entry in manifest.get('migrations', []):
              f = entry.get('file') if isinstance(entry, dict) else None
              if f and (mod/f).exists(): entry['sha256'] = hashlib.sha256((mod/f).read_bytes()).hexdigest()
          if isinstance(manifest.get('mainScriptFile'), dict):
              manifest['mainScriptFile']['sha256'] = hashlib.sha256(reminder.read_bytes()).hexdigest()
          write(mp, json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Syntax checks
        shell: bash
        run: |
          node --check SkyReminderModules/001_constants_and_navigation.js
          cp Sky_今日の大キャン案内.js /tmp/candle.mjs && node --check /tmp/candle.mjs
          cp Sky_星の子リマインダー.js /tmp/reminder.mjs && node --check /tmp/reminder.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('SkyReminderModules/manifest.json').read_text())
          parts=[]
          for x in m['parts']:
            p=Path('SkyReminderModules')/x['file']
            parts.append(p.read_text())
          Path('/tmp/reminder-bundle.js').write_text('(async()=>{\n'+'\n'.join(parts)+'\n})();')
          PY
          node --check /tmp/reminder-bundle.js
      - name: Commit source updates
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SkyReminderModules Sky_星の子リマインダー.js Sky_今日の大キャン案内.js
          git commit -m "Centralize Sky system settings source"
          git push origin main
