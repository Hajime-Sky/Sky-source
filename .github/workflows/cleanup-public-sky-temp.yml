name: Cleanup public Sky source work
on:
  create:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'trigger-cleanup-public-sky-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove per-app manual update and temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sky_今日の大キャン案内.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    alert.addAction("更新を確認");\n','')
          old='''    if (index === 4) {
      const restarted = await runManualUpdateAndMaybeRestart();
      if (restarted) return;
      continue;
    }
    if (index === 5) {
      await resetCacheAndReport();
      continue;
    }'''
          if old not in s:
            old='''    if (index === 4) {
      const didRestart = await runManualUpdateAndMaybeRestart();
      if (didRestart) return;
      continue;
    }
    if (index === 5) {
      await resetCacheAndReport();
      continue;
    }'''
          new='''    if (index === 4) {
      await resetCacheAndReport();
      continue;
    }'''
          if old not in s: raise SystemExit('manual update index block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check 'Sky_今日の大キャン案内.js'
          node --check 'Sky_星の子リマインダー.js'
          rm -f .public-common-actions-trigger .action-create-ok .workflow-probe-now
          rm -f \
            .github/workflows/_test-create-trigger.yml \
            .github/workflows/_probe-create-now.yml \
            .github/workflows/public-common-actions-once.yml \
            .github/workflows/finalize-public-sky-source-once.yml \
            .github/workflows/finalize-public-sky-source-v2-once.yml \
            .github/workflows/apply-public-sky-v3.yml \
            .github/workflows/cleanup-public-sky-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean public Sky source maintenance files and update UI'
          git push origin main
          for b in \
            trigger-public-actions-20260818 \
            trigger-public-sky-source-20260818 \
            trigger-public-sky-source-20260818b \
            trigger-public-sky-source-v2-20260818 \
            trigger-probe-now-20260818 \
            trigger-apply-public-sky-v3-20260818 \
            trigger-cleanup-public-sky-20260818; do
            git push origin --delete "$b" || true
          done