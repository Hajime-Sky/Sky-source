name: Cleanup settings UI wording
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/cleanup_settings_ui.py
      - name: Validate reminder bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          d=Path('SkyReminderModules')
          m=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          for ent in m['parts']:
              p=d/ent['file']
              if hashlib.sha256(p.read_bytes()).hexdigest()!=ent['sha256']:
                  raise SystemExit('hash mismatch: '+ent['file'])
          Path('/tmp/reminder-bundle.js').write_text('(async()=>{\n'+'\n'.join((d/e['file']).read_text(encoding='utf-8') for e in m['parts'])+'\n})();', encoding='utf-8')
          PY
          node --check /tmp/reminder-bundle.js
      - name: Commit source cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SkyReminderModules/001_constants_and_navigation.js SkyReminderModules/005_app_ui_html_and_client.js SkyReminderModules/manifest.json
          git commit -m "Remove migration wording from reminder UI"
          git push origin main
