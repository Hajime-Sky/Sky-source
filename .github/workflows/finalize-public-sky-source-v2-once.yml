name: Finalize public Sky source v2
on:
  create:
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'trigger-public-sky-source-v2-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch public runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,datetime
          def rep(s,o,n,label):
              if o not in s: raise SystemExit('marker missing '+label)
              return s.replace(o,n,1)

          star=Path('Sky_星の子リマインダー.js'); s=star.read_text(encoding='utf-8')
          if 'SKY_REMINDER_PERSIST_DIAGNOSTICS' not in s:
              s=rep(s,'const SKY_REMINDER_WIDGET_DEBUG_FILE = "runtime.log";\n','const SKY_REMINDER_WIDGET_DEBUG_FILE = "runtime.log";\nconst SKY_REMINDER_PERSIST_DIAGNOSTICS = false;\n','star debug const')
              s=rep(s,'function skyReminderWidgetDebug(event, detail = {}) {\n  try {','function skyReminderWidgetDebug(event, detail = {}) {\n  if (!SKY_REMINDER_PERSIST_DIAGNOSTICS) return;\n  try {','star debug guard')
          star.write_text(s,encoding='utf-8')

          p=Path('Sky_今日の大キャン案内.js'); s=p.read_text(encoding='utf-8')
          if 'CANDLE_PERSIST_DIAGNOSTICS' not in s:
              s=rep(s,'const WIDGET_DEBUG_DIR = "HajimeSkyTools/_chatgpt-debug/widget-refresh";\n','const WIDGET_DEBUG_DIR = "HajimeSkyTools/_internal/widget-refresh";\nconst CANDLE_PERSIST_DIAGNOSTICS = false;\n','candle debug const')
              s=rep(s,'function candleWidgetDebug(event, detail = {}) {\n  try {','function candleWidgetDebug(event, detail = {}) {\n  if (!CANDLE_PERSIST_DIAGNOSTICS) return;\n  try {','candle debug guard')
          old_text='''function buildTextOutput(res, cacheMeta) {
  const lines = [];
  lines.push(`基準LA時刻: ${res.laNow}`);
  lines.push(`タイムゾーン: ${res.tzLabel}`);
  lines.push(`Sky日付: ${res.skyYMD}`);
  lines.push(`今日の画像: ${res.pattern.label}`);
  lines.push(`地方: ${res.realm.jp} (${res.realm.en})`);
  lines.push(`Rotation: ${res.rotIndex + 1}/${res.patternMeta.patterns.length}`);
  if (res.cycle && res.cycle.source) lines.push(`サイクル: ${res.cycle.source}`);
  lines.push("");
  lines.push(`見分け方: ${res.patternMeta.identifyDetailed}`);
  lines.push("");
  res.pattern.detailed.forEach((s, i) => lines.push(`${i + 1}. ${s}`));
  lines.push("");
  if (cacheMeta && cacheMeta.updatedAt) lines.push(`キャッシュ更新: ${cacheMeta.updatedAt}`);
  lines.push(`保存画像数: ${getSavedImageCount()}/${getExpectedLabels().length}`);
  lines.push("保存方式: ファイルシステム (Raw PNG)");
  lines.push(`想定最小解像度: ${MIN_SOURCE_IMAGE_SIZE}x${MIN_SOURCE_IMAGE_SIZE}`);
  return lines.join("\\n");
}'''
          new_text='''function buildTextOutput(res, cacheMeta) {
  const lines = [];
  lines.push(`日付: ${res.skyYMD}`);
  lines.push(`今日の大キャン: ${res.pattern.label}`);
  lines.push(`地方: ${res.realm.jp}`);
  lines.push("");
  lines.push(`見分け方: ${res.patternMeta.identifyDetailed}`);
  lines.push("");
  res.pattern.detailed.forEach((text, i) => lines.push(`${i + 1}. ${text}`));
  return lines.join("\\n");
}'''
          if old_text in s: s=rep(s,old_text,new_text,'candle text')
          old_summary='''function buildAppSummary(res, cacheMeta) {
  const lines = [];
  const updateState = readUpdateState();
  const policyLabel = updateState.policy === "none" ? "更新しない" : updateState.policy === "always" ? "毎回" : "24時間";
  lines.push(`今日の画像: ${res.pattern.label}`);
  lines.push(`地方: ${res.realm.jp}`);
  lines.push(`Sky日付: ${res.skyYMD}`);
  lines.push(`Rotation: ${res.rotIndex + 1}/${res.patternMeta.patterns.length}`);
  lines.push(`基準LA時刻: ${res.laNow}`);
  lines.push(`保存画像数: ${getSavedImageCount()}/${getExpectedLabels().length}`);
  if (cacheMeta && cacheMeta.updatedAt) lines.push(`最終更新: ${cacheMeta.updatedAt}`);
  if (cacheMeta) lines.push(`品質状態: ${needsQualityRefresh(cacheMeta) ? "再取得推奨" : "最新1280px想定"}`);
  if (cacheMeta && cacheMeta.lastError) lines.push(`前回エラー: ${cacheMeta.lastError}`);
  lines.push(`GitHub更新: ${policyLabel} / ${updateState.lastStatus || "未実行"}`);
  lines.push(`最終確認: ${formatLocalDateTimeFromMs(updateState.lastCheckedAtMs)}`);
  return lines.join("\\n");
}'''
          new_summary='''function buildAppSummary(res, cacheMeta) {
  const lines = [];
  lines.push(`今日の大キャン: ${res.pattern.label}`);
  lines.push(`地方: ${res.realm.jp}`);
  lines.push(`日付: ${res.skyYMD}`);
  lines.push(`保存済み画像: ${getSavedImageCount()}/${getExpectedLabels().length}`);
  if (cacheMeta && needsQualityRefresh(cacheMeta)) lines.push("画像の再取得をおすすめします");
  if (cacheMeta && cacheMeta.lastError) lines.push("前回の画像取得でエラーがありました");
  return lines.join("\\n");
}'''
          if old_summary in s: s=rep(s,old_summary,new_summary,'candle summary')
          s=s.replace('alert.addAction("今すぐ更新");','alert.addAction("更新を確認");')
          dispatch='''const __commonAction = String(args?.queryParameters?.commonAction || "");
  if (__commonAction === "githubUpdate") {'''
          if dispatch in s:
              dispatch_new='''const __commonAction = String(args?.queryParameters?.skyCommonAction || args?.queryParameters?.commonAction || "");
  if (__commonAction === "refreshWidget") {
    try {
      const widget = await createWidget({ reason: "common-settings", refreshDelayMs: 60 * 1000 });
      Script.setWidget(widget);
    } catch (e) { try { console.error("Widget refresh failed:", e); } catch (_) {} }
    try {
      const parsed = JSON.parse(String(args?.queryParameters?.skyCommonChain || "[]"));
      const chain = Array.isArray(parsed) ? parsed.map(String).filter(Boolean) : [];
      const next = chain.shift();
      if (next) {
        const isReminder = String(next).normalize("NFC").includes("星の子リマインダー");
        const q = isReminder ? "action=commonrefresh" : "skyCommonAction=refreshWidget&skyCommonChain=" + encodeURIComponent(JSON.stringify(chain));
        Safari.open("scriptable:///run?scriptName=" + encodeURIComponent(next) + "&" + q);
      }
    } catch (_) {}
    Script.complete();
  } else if (__commonAction === "githubUpdate") {'''
              s=rep(s,dispatch,dispatch_new,'candle dispatch')
          p.write_text(s,encoding='utf-8')

          mp=Path('SkyReminderModules/manifest.json'); m=json.loads(mp.read_text(encoding='utf-8'))
          m['sourceVersion']='v2.28_public_ready'; m['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          for x in m.get('parts',[]): x['sha256']=hashlib.sha256((Path('SkyReminderModules')/x['file']).read_bytes()).hexdigest()
          for x in m.get('migrations',[]): x['sha256']=hashlib.sha256((Path('SkyReminderModules')/x['file']).read_bytes()).hexdigest()
          m['mainScriptFile']['sha256']=hashlib.sha256(star.read_bytes()).hexdigest()
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          node --check 'Sky_星の子リマインダー.js'
          node --check 'Sky_今日の大キャン案内.js'
          grep -q '__commonAction === "refreshWidget"' 'Sky_今日の大キャン案内.js'
          ! grep -q 'Rotation:' 'Sky_今日の大キャン案内.js'
          ! grep -q '最新1280px想定' 'Sky_今日の大キャン案内.js'
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('SkyReminderModules/manifest.json').read_text())
          for x in m['parts']:
              p=Path('SkyReminderModules')/x['file']; assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          assert hashlib.sha256(Path('Sky_星の子リマインダー.js').read_bytes()).hexdigest()==m['mainScriptFile']['sha256']
          PY
          rm -f .public-common-actions-trigger .action-create-ok .github/workflows/_test-create-trigger.yml .github/workflows/public-common-actions-once.yml .github/workflows/finalize-public-sky-source-once.yml .github/workflows/finalize-public-sky-source-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize public Sky sources for general users'
          git push origin main
          git push origin --delete trigger-public-actions-20260818 trigger-public-sky-source-20260818 trigger-public-sky-source-20260818b "${GITHUB_REF_NAME}" || true