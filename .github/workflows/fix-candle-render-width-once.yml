name: Fix candle render width
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sky_今日の大キャン案内.js')
          s=p.read_text(encoding='utf-8')
          old='''    const textRect = new Rect(\n      drawX,\n      textY,\n      imageWidth,\n      Math.floor(68 * scale)\n    );'''
          new='''    const textRect = new Rect(\n      drawX,\n      textY,\n      canvasWidth,\n      Math.floor(68 * scale)\n    );'''
          if old not in s: raise SystemExit('textRect width marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check Sky_今日の大キャン案内.js
          ! grep -q 'imageWidth' Sky_今日の大キャン案内.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sky_今日の大キャン案内.js
          git commit -m "Fix treasure candle scaled text width"
          git push origin main
