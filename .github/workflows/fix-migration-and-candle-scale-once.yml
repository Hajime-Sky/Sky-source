name: Fix migration retention and candle scale
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime

          # Keep the migration module on disk. Applied migrations are already tracked
          # by the visible migration-state JSON, so deleting the source file causes
          # GitHubSync to see a false remote-only deletion candidate.
          reminder = Path('Sky_星の子リマインダー.js')
          s = reminder.read_text(encoding='utf-8')
          call = '  skyReminderDeleteLocalMigrationFiles(fm, moduleDir, manifest);\n'
          if call not in s:
              raise SystemExit('migration deletion call missing')
          s = s.replace(call, '', 1)
          reminder.write_text(s, encoding='utf-8')

          # Render at the device's physical screen scale, capped by the 1280px source.
          candle = Path('Sky_今日の大キャン案内.js')
          s = candle.read_text(encoding='utf-8')
          old = '''  // ウィジェット実行は2x実表示解像度で合成し、高解像度DrawContextによるメモリ超過を避ける。\n  // アプリ内プレビューは従来どおり元画像解像度を維持する。\n  const widgetTargetWidth = Math.max(340, Math.round(spec.width * 2));\n  const canvasWidth = config.runsInWidget ? Math.min(sourceWidth, widgetTargetWidth) : sourceWidth;'''
          new = '''  // ウィジェット実行は端末の物理解像度倍率に合わせて合成する。\n  // @3x端末では3xまで確保してぼけを防ぎつつ、元画像解像度を上限にして過剰なDrawContextを避ける。\n  // アプリ内プレビューは従来どおり元画像解像度を維持する。\n  let deviceScale = 2;\n  try { deviceScale = Math.max(1, Number(Device.screenScale()) || 2); } catch (_) {}\n  const widgetTargetWidth = Math.max(340, Math.round(spec.width * deviceScale));\n  const canvasWidth = config.runsInWidget ? Math.min(sourceWidth, widgetTargetWidth) : sourceWidth;'''
          if old not in s:
              raise SystemExit('candle 2x render marker missing')
          s = s.replace(old, new, 1)
          candle.write_text(s, encoding='utf-8')

          manifest = Path('SkyReminderModules/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['mainScriptFile']['sha256'] = hashlib.sha256(reminder.read_bytes()).hexdigest()
          m['sourceVersion'] = 'v2.27_keep_migration_and_native_scale'
          m['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          node --check Sky_星の子リマインダー.js
          node --check Sky_今日の大キャン案内.js
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          r=Path('Sky_星の子リマインダー.js')
          c=Path('Sky_今日の大キャン案内.js')
          m=json.loads(Path('SkyReminderModules/manifest.json').read_text(encoding='utf-8'))
          assert m['sourceVersion']=='v2.27_keep_migration_and_native_scale'
          assert m['mainScriptFile']['sha256']==hashlib.sha256(r.read_bytes()).hexdigest()
          assert '  skyReminderDeleteLocalMigrationFiles(fm, moduleDir, manifest);\n' not in r.read_text(encoding='utf-8')
          cs=c.read_text(encoding='utf-8')
          assert 'Device.screenScale()' in cs
          assert 'spec.width * 2' not in cs
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sky_星の子リマインダー.js Sky_今日の大キャン案内.js SkyReminderModules/manifest.json
          git commit -m "Keep migration module and use native widget scale"
          git push origin main