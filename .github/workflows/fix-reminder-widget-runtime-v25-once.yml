name: Fix reminder widget runtime v25
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reminder widget runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime, re

          d = Path('SkyReminderModules')
          w = d / '004d_widget_layout.js'
          s = w.read_text(encoding='utf-8')
          s = s.replace('const WIDGET_RUNTIME_REV = "v2.24";', 'const WIDGET_RUNTIME_REV = "v2.25";', 1)
          old = '''  const layout = resolveWidgetLayout(family, viewMode, layoutMode);\n  const cells = buildCellRenders(now, viewMode, layout, settings);'''
          new = '''  const layout = resolveWidgetLayout(family, viewMode, layoutMode);\n  try {\n    if (typeof skyReminderCreateWholeWidgetBackground === "function") {\n      const bg = skyReminderCreateWholeWidgetBackground(settings.theme, layout, viewMode);\n      if (bg) {\n        w.backgroundImage = bg;\n        try { if (typeof skyReminderWidgetDebug === "function") skyReminderWidgetDebug("widget-background", { runtimeRev: WIDGET_RUNTIME_REV, width: Number(bg?.size?.width || 0), height: Number(bg?.size?.height || 0) }); } catch (_) {}\n      }\n    }\n  } catch (e) {\n    try { if (typeof skyReminderWidgetDebug === "function") skyReminderWidgetDebug("widget-background-failed", { runtimeRev: WIDGET_RUNTIME_REV, error: String(e && (e.stack || e.message) || e) }); } catch (_) {}\n  }\n  const cells = buildCellRenders(now, viewMode, layout, settings);'''
          if old not in s:
              raise SystemExit('004d layout marker missing')
          s = s.replace(old, new, 1)
          w.write_text(s, encoding='utf-8')

          p = d / '008_github_update_scaffold.js'
          s = p.read_text(encoding='utf-8')
          old_size = '''  const longSide = Math.max(lw, lh);\n  const scale = 800 / longSide;\n  return new Size(Math.max(1, Math.round(lw * scale)), Math.max(1, Math.round(lh * scale)));'''
          new_size = '''  const longSide = Math.max(lw, lh);\n  const targetLongSide = Math.min(640, Math.max(320, longSide * 2));\n  const scale = targetLongSide / longSide;\n  return new Size(Math.max(1, Math.round(lw * scale)), Math.max(1, Math.round(lh * scale)));'''
          if old_size not in s:
              raise SystemExit('008 background size marker missing')
          s = s.replace(old_size, new_size, 1)

          start = 'const SKY_REMINDER_NATIVE_RUN_WIDGET = typeof runWidget === "function" ? runWidget : null;\n'
          end = 'runWidget = skyReminderRunWidgetWithStarryBackground;\n'
          i = s.find(start)
          j = s.find(end, i + len(start)) if i >= 0 else -1
          if i < 0 or j < 0:
              raise SystemExit('008 runWidget override block missing')
          j += len(end)
          s = s[:i] + s[j:]
          p.write_text(s, encoding='utf-8')

          mp = d / 'manifest.json'
          m = json.loads(mp.read_text(encoding='utf-8'))
          for e in m.get('parts', []):
              if isinstance(e, dict) and e.get('file'):
                  fp = d / e['file']
                  e['sha256'] = hashlib.sha256(fp.read_bytes()).hexdigest()
          m['sourceVersion'] = 'v2.25_widget_runtime_ssot'
          m['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          node --check SkyReminderModules/004d_widget_layout.js
          node --check SkyReminderModules/008_github_update_scaffold.js
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          d=Path('SkyReminderModules')
          m=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          assert m['sourceVersion']=='v2.25_widget_runtime_ssot'
          for e in m['parts']:
              assert hashlib.sha256((d/e['file']).read_bytes()).hexdigest()==e['sha256'], e['file']
          s=(d/'008_github_update_scaffold.js').read_text(encoding='utf-8')
          assert 'runWidget = skyReminderRunWidgetWithStarryBackground' not in s
          assert 'SKY_REMINDER_NATIVE_RUN_WIDGET' not in s
          w=(d/'004d_widget_layout.js').read_text(encoding='utf-8')
          assert 'WIDGET_RUNTIME_REV = "v2.25"' in w
          assert 'widget-background' in w
          Path('/tmp/reminder.js').write_text('(async()=>{\n'+'\n'.join((d/e['file']).read_text(encoding='utf-8') for e in m['parts'])+'\n})();', encoding='utf-8')
          PY
          node --check /tmp/reminder.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SkyReminderModules/004d_widget_layout.js SkyReminderModules/008_github_update_scaffold.js SkyReminderModules/manifest.json
          git commit -m "Use one reminder widget runtime path"
          git push origin main
