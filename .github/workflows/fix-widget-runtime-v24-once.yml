name: Fix widget runtime v24
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtimes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime

          def rep(path, old, new, label):
              s = path.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit('marker missing: ' + label)
              path.write_text(s.replace(old, new, 1), encoding='utf-8')

          root = Path('Sky_星の子リマインダー.js')
          s = root.read_text(encoding='utf-8')
          marker = 'const SKY_REMINDER_MAIN_SCRIPT = "Sky_星の子リマインダー.js";\n'
          insert = marker + '''function skyReminderCurrentScriptName() {\n  try {\n    const name = String(Script.name() || "").trim();\n    if (name) return name;\n  } catch (_) {}\n  return SKY_REMINDER_MAIN_SCRIPT.replace(/\\.js$/i, "");\n}\nfunction skyReminderCurrentMainScriptFilename() {\n  return skyReminderCurrentScriptName() + ".js";\n}\n'''
          if 'function skyReminderCurrentScriptName()' not in s:
              if marker not in s: raise SystemExit('main script marker missing')
              s = s.replace(marker, insert, 1)
          s = s.replace('const mainPath = fm.joinPath(fm.documentsDirectory(), SKY_REMINDER_MAIN_SCRIPT);', 'const mainPath = fm.joinPath(fm.documentsDirectory(), skyReminderCurrentMainScriptFilename());', 1)
          s = s.replace('return "scriptable:///run?scriptName=" + encodeURIComponent(SKY_REMINDER_MAIN_SCRIPT);', 'return "scriptable:///run?scriptName=" + encodeURIComponent(skyReminderCurrentScriptName());', 1)
          old = '''  let manifest = await skyReminderLoadManifest(fm, moduleDir);\n  manifest = await skyReminderUpdateFromGitHubIfNeeded(fm, moduleDir, manifest);\n  const parts = skyReminderManifestParts(manifest);'''
          new = '''  let manifest = await skyReminderLoadManifest(fm, moduleDir);\n  try { skyReminderWidgetDebug("package-before-update", { sourceVersion: String(manifest?.sourceVersion || ""), mainFile: skyReminderCurrentMainScriptFilename() }); } catch (_) {}\n  manifest = await skyReminderUpdateFromGitHubIfNeeded(fm, moduleDir, manifest);\n  try {\n    const expected = Object.create(null);\n    for (const p of (manifest?.parts || [])) if (p && p.file) expected[String(p.file)] = String(p.sha256 || "");\n    const probe = {};\n    for (const file of ["004d_widget_layout.js", "007_shortcut_entrypoint.js"]) {\n      const p = fm.joinPath(moduleDir, file);\n      probe[file] = { expected: expected[file] || "", actual: await skyReminderLocalSha256(fm, p) };\n    }\n    skyReminderWidgetDebug("package-active", { sourceVersion: String(manifest?.sourceVersion || ""), mainFile: skyReminderCurrentMainScriptFilename(), probe });\n  } catch (e) { try { skyReminderWidgetDebug("package-probe-failed", { error: String(e) }); } catch (_) {} }\n  const parts = skyReminderManifestParts(manifest);'''
          if old not in s: raise SystemExit('run parts marker missing')
          s = s.replace(old, new, 1)
          root.write_text(s, encoding='utf-8')

          w = Path('SkyReminderModules/004d_widget_layout.js')
          s = w.read_text(encoding='utf-8')
          s = s.replace('const WIDGET_DATA_CACHE_REV = "2026-04-22-shard-label-v3";', 'const WIDGET_DATA_CACHE_REV = "2026-08-17-widget-refresh-v4";\nconst WIDGET_RUNTIME_REV = "v2.24";', 1)
          s = s.replace('function runWidget(now, options = {}) {\n  const settings = loadSettings();', 'function runWidget(now, options = {}) {\n  try { if (typeof skyReminderWidgetDebug === "function") skyReminderWidgetDebug("widget-runtime-enter", { runtimeRev: WIDGET_RUNTIME_REV }); } catch (_) {}\n  const settings = loadSettings();', 1)
          s = s.replace('skyReminderWidgetDebug("widget-build-start", { reason: debugReason, refreshAfter: w.refreshAfterDate.toISOString(), effectiveNow: now instanceof Date ? now.toISOString() : String(now) })', 'skyReminderWidgetDebug("widget-build-start", { runtimeRev: WIDGET_RUNTIME_REV, reason: debugReason, refreshAfter: w.refreshAfterDate.toISOString(), effectiveNow: now instanceof Date ? now.toISOString() : String(now), viewMode: settings.viewMode, layoutMode: settings.layoutMode, theme: settings.theme })', 1)
          w.write_text(s, encoding='utf-8')

          c = Path('Sky_今日の大キャン案内.js')
          s = c.read_text(encoding='utf-8')
          old = '''function renderWidgetImageWithDate(image, family, dateText) {\n  const spec = getWidgetCanvasSpec(family);\n  const imageWidth = image.size.width;\n  const imageHeight = image.size.height;\n  if (!(imageWidth > 0) || !(imageHeight > 0)) return image;\n  // 幅合わせ: キャンバスの幅を画像の幅に固定し、高さをウィジェットのアスペクト比に合わせて算出\n  const canvasWidth = imageWidth;\n  const canvasHeight = Math.round(canvasWidth * (spec.height / spec.width));'''
          new = '''function renderWidgetImageWithDate(image, family, dateText) {\n  const spec = getWidgetCanvasSpec(family);\n  const sourceWidth = image.size.width;\n  const sourceHeight = image.size.height;\n  if (!(sourceWidth > 0) || !(sourceHeight > 0)) return image;\n  // ウィジェット実行は2x実表示解像度で合成し、高解像度DrawContextによるメモリ超過を避ける。\n  // アプリ内プレビューは従来どおり元画像解像度を維持する。\n  const widgetTargetWidth = Math.max(340, Math.round(spec.width * 2));\n  const canvasWidth = config.runsInWidget ? Math.min(sourceWidth, widgetTargetWidth) : sourceWidth;\n  const imageScale = canvasWidth / sourceWidth;\n  const scaledImageHeight = Math.max(1, Math.round(sourceHeight * imageScale));\n  const canvasHeight = Math.round(canvasWidth * (spec.height / spec.width));'''
          if old not in s: raise SystemExit('render start marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('const drawY = Math.round((canvasHeight - imageHeight) / 2);\n  ctx.drawImageInRect(image, new Rect(drawX, drawY, imageWidth, imageHeight));', 'const drawY = Math.round((canvasHeight - scaledImageHeight) / 2);\n  ctx.drawImageInRect(image, new Rect(drawX, drawY, canvasWidth, scaledImageHeight));', 1)
          s = s.replace('const scale = imageWidth / 1280;', 'const scale = canvasWidth / 1280;', 1)
          old2 = '''  let bgImage = renderWidgetImageWithDate(image, family, res.skyYMD);\n  image = null; // 元画像のメモリを解放\n  try {\n    const fm = FileManager.local();\n    const tempDir = getAppTempDir();\n    const tempPath = fm.joinPath(tempDir, `widget_bg_${family}.png`);\n    fm.writeImage(tempPath, bgImage);\n    bgImage = null; // 合成画像のメモリを解放\n    widget.backgroundImage = Image.fromFile(tempPath);\n  } catch (e) {\n    widget.backgroundImage = bgImage;\n  }\n  return widget;'''
          new2 = '''  candleWidgetDebug("widget-render-start", { reason: debugReason, family, sourceWidth: image.size.width, sourceHeight: image.size.height });\n  let bgImage = renderWidgetImageWithDate(image, family, res.skyYMD);\n  image = null; // 元画像のメモリを解放\n  candleWidgetDebug("widget-render-complete", { reason: debugReason, family, width: bgImage?.size?.width || 0, height: bgImage?.size?.height || 0 });\n  widget.backgroundImage = bgImage;\n  bgImage = null;\n  candleWidgetDebug("widget-return", { reason: debugReason, family });\n  return widget;'''
          if old2 not in s: raise SystemExit('widget temp roundtrip marker missing')
          s = s.replace(old2, new2, 1)
          c.write_text(s, encoding='utf-8')

          mp = Path('SkyReminderModules/manifest.json')
          m = json.loads(mp.read_text(encoding='utf-8'))
          for ent in m.get('parts', []):
              if isinstance(ent, dict) and ent.get('file'):
                  p = mp.parent / ent['file']
                  ent['sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
          m['sourceVersion'] = 'v2.24_widget_runtime_fix'
          m['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          m['mainScriptFile']['sha256'] = hashlib.sha256(root.read_bytes()).hexdigest()
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          node --check Sky_星の子リマインダー.js
          node --check Sky_今日の大キャン案内.js
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          d=Path('SkyReminderModules')
          m=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          assert m['sourceVersion']=='v2.24_widget_runtime_fix'
          for e in m['parts']:
              assert hashlib.sha256((d/e['file']).read_bytes()).hexdigest()==e['sha256'], e['file']
          assert hashlib.sha256(Path('Sky_星の子リマインダー.js').read_bytes()).hexdigest()==m['mainScriptFile']['sha256']
          Path('/tmp/reminder.js').write_text('(async()=>{\n'+'\n'.join((d/e['file']).read_text(encoding='utf-8') for e in m['parts'])+'\n})();',encoding='utf-8')
          PY
          node --check /tmp/reminder.js
          grep -q 'WIDGET_RUNTIME_REV = "v2.24"' SkyReminderModules/004d_widget_layout.js
          grep -q 'widget-render-complete' Sky_今日の大キャン案内.js
          grep -q 'skyReminderCurrentMainScriptFilename' Sky_星の子リマインダー.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sky_星の子リマインダー.js Sky_今日の大キャン案内.js SkyReminderModules/004d_widget_layout.js SkyReminderModules/manifest.json
          git commit -m "Fix Sky widget runtime refresh path"
          git push origin main
